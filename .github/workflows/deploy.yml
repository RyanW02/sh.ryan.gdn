name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore bash WASM cache
        id: cache-bash
        uses: actions/cache/restore@v4
        with:
          path: public/bash
          key: bash-wasm-${{ hashFiles('wasm/bash/VERSION', 'wasm/bash/patches/**', 'wasm/bash/build.sh', 'wasm/bash/build-inner.sh', 'wasm/bash/Dockerfile', 'wasm/bash/wasm-tool-bridge.js', 'pnpm-lock.yaml') }}

      # Docker-based Emscripten builds -- ubuntu-latest runners have Docker
      # available by default, no extra setup needed. These produce the
      # gitignored public/bash/* and public/tools/* WASM artifacts that
      # `vite build` copies into dist/; see wasm/bash/README.md.
      - run: pnpm run build:bash
        if: steps.cache-bash.outputs.cache-hit != 'true'

      # Only main's own successful builds get to populate the shared cache --
      # never from a PR-triggered run, even if one is added later -- so an
      # untrusted branch can never poison what main restores from.
      - name: Save bash WASM cache
        if: steps.cache-bash.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: public/bash
          key: ${{ steps.cache-bash.outputs.cache-primary-key }}

      - name: Restore spike-tool WASM cache
        id: cache-spike-tool
        uses: actions/cache/restore@v4
        with:
          path: public/tools
          key: spike-tool-wasm-${{ hashFiles('wasm/spike-tool/build.sh', 'wasm/spike-tool/echoargv.c') }}

      - run: pnpm run build:spike-tool
        if: steps.cache-spike-tool.outputs.cache-hit != 'true'

      - name: Save spike-tool WASM cache
        if: steps.cache-spike-tool.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: public/tools
          key: ${{ steps.cache-spike-tool.outputs.cache-primary-key }}

      - name: Restore busybox WASM cache
        id: cache-busybox
        uses: actions/cache/restore@v4
        with:
          path: public/tools
          key: busybox-wasm-${{ hashFiles('wasm/busybox/VERSION', 'wasm/busybox/busybox.config', 'wasm/busybox/build.sh', 'wasm/busybox/build-inner.sh', 'wasm/busybox/Dockerfile') }}

      - run: pnpm run build:busybox
        if: steps.cache-busybox.outputs.cache-hit != 'true'

      - name: Save busybox WASM cache
        if: steps.cache-busybox.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: public/tools
          key: ${{ steps.cache-busybox.outputs.cache-primary-key }}

      - run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
